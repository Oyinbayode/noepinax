#cloud-config
#
# cloud-init for the noepinax agent host (GCE e2-micro, Container-Optimized OS).
#
# What this does on first boot:
#   1. Configures Docker to authenticate to Artifact Registry
#   2. Fetches all required secrets from Secret Manager into a root-owned env
#      file at /etc/noepinax/agents.env (mode 0600 — never readable by users)
#   3. Reads non-secret runtime config (image, API_URL, contract addresses)
#      from instance metadata and appends them to the same env file
#   4. Installs a systemd unit that runs the agent container with that env
#      file, restarts on failure, and ships logs to Cloud Logging
#
# Why this shape:
#   - Container-Optimized OS doesn't support --container-secret-env, so we
#     can't use `gcloud compute instances create-with-container`. We use a
#     plain COS instance and run docker ourselves under systemd.
#   - Secrets never appear in instance metadata (which is readable by anyone
#     on the box via the metadata server). They sit in Secret Manager, are
#     fetched at boot using the VM's service account token, and only land in
#     a root-owned file inside the VM. Rotation = restart the VM.
#   - The image, API URL, and contract addresses ARE in metadata — they're
#     not secrets, and putting them there means you can roll out a new
#     deploy / point at a new contract by updating instance metadata and
#     rebooting, without rebuilding the cloud-init.

write_files:
  # ------------------------------------------------------------------
  # Docker credential config for Artifact Registry. COS does NOT
  # pre-configure auth for *-docker.pkg.dev — `docker pull` makes an
  # unauthenticated request and fails. Telling docker to use the
  # docker-credential-gcr helper (which is preinstalled on COS and
  # fetches a token from the metadata server) fixes it. Lives under
  # /var/lib/cloud/ because /root is read-only on COS, and we point
  # docker at it via DOCKER_CONFIG in the systemd unit.
  # ------------------------------------------------------------------
  - path: /var/lib/cloud/noepinax/docker/config.json
    permissions: "0644"
    owner: root:root
    content: |
      {"credHelpers":{"us-central1-docker.pkg.dev":"gcr"}}

  # ------------------------------------------------------------------
  # Secret fetcher. Runs at boot, idempotent (rewrites the env file).
  # ------------------------------------------------------------------
  - path: /var/lib/cloud/noepinax/fetch-config.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/bin/bash
      set -euo pipefail

      ENV_FILE=/etc/noepinax/agents.env
      MD=http://metadata.google.internal/computeMetadata/v1
      MD_HDR="Metadata-Flavor: Google"

      mkdir -p /etc/noepinax
      umask 077

      # --- Identity / token ----------------------------------------------
      PROJECT=$(curl -s -H "$MD_HDR" "$MD/project/project-id")
      TOKEN=$(curl -s -H "$MD_HDR" \
        "$MD/instance/service-accounts/default/token" \
        | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")

      # --- Secret list ---------------------------------------------------
      # Each entry: ENV_VAR_NAME:secret-manager-secret-name
      # These match the existing Cloud Run secret names (uppercase, underscores).
      SECRETS=(
        "INTERNAL_API_TOKEN:INTERNAL_API_TOKEN"
        "VENICE_API_KEY:VENICE_API_KEY"
        "PINATA_JWT:PINATA_JWT"
        "ALCHEMY_API_KEY:ALCHEMY_API_KEY"
        "AGENT_NOEPINAX_PRIVATE_KEY:AGENT_NOEPINAX_PRIVATE_KEY"
        "AGENT_TEMPERANCE_PRIVATE_KEY:AGENT_TEMPERANCE_PRIVATE_KEY"
        "AGENT_FERVOR_PRIVATE_KEY:AGENT_FERVOR_PRIVATE_KEY"
        "AGENT_DUSK_PRIVATE_KEY:AGENT_DUSK_PRIVATE_KEY"
        "AGENT_CONTRARIAN_PRIVATE_KEY:AGENT_CONTRARIAN_PRIVATE_KEY"
        "AGENT_ECHO_PRIVATE_KEY:AGENT_ECHO_PRIVATE_KEY"
      )

      # Write to a temp file then atomically swap, so a partial fetch never
      # leaves the agents running with a half-populated env.
      TMP=$(mktemp)
      chmod 600 "$TMP"

      echo "# generated by fetch-config.sh at $(date -Iseconds) — do not edit" > "$TMP"

      for entry in "${SECRETS[@]}"; do
        var="${entry%%:*}"
        name="${entry##*:}"
        url="https://secretmanager.googleapis.com/v1/projects/$PROJECT/secrets/$name/versions/latest:access"
        payload=$(curl -sf -H "Authorization: Bearer $TOKEN" "$url") || {
          echo "[fetch-config] FAILED to read secret '$name' — aborting" >&2
          rm -f "$TMP"
          exit 1
        }
        value=$(echo "$payload" \
          | python3 -c "import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)['payload']['data']).decode())")
        # NB: agents.env is consumed via docker --env-file which does NOT do
        # shell parsing — quotes are literal. Just write KEY=VALUE.
        printf '%s=%s\n' "$var" "$value" >> "$TMP"
      done

      # --- Non-secret runtime config from instance metadata --------------
      # These are set with `--metadata=key=value` at instance create time.
      for kv in \
        "API_URL:api-url" \
        "NOEPINAX_ART_ADDRESS:noepinax-art-address" \
        "NOEPINAX_AUCTION_ADDRESS:noepinax-auction-address" \
        "NOEPINAX_MARKETPLACE_ADDRESS:noepinax-marketplace-address"; do
        var="${kv%%:*}"
        key="${kv##*:}"
        val=$(curl -sf -H "$MD_HDR" "$MD/instance/attributes/$key" || true)
        if [[ -n "$val" ]]; then
          printf '%s=%s\n' "$var" "$val" >> "$TMP"
        fi
      done

      mv "$TMP" "$ENV_FILE"
      chmod 600 "$ENV_FILE"
      echo "[fetch-config] wrote $ENV_FILE ($(wc -l < "$ENV_FILE") vars)"

  # ------------------------------------------------------------------
  # systemd unit — runs the agent container under docker, restarts on
  # failure, ships stdout/stderr to Cloud Logging via the gcplogs driver.
  # ------------------------------------------------------------------
  - path: /etc/systemd/system/noepinax-agents.service
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=Noepinax agents
      After=network-online.target docker.service
      Wants=network-online.target
      Requires=docker.service

      [Service]
      Type=simple
      Restart=always
      RestartSec=10

      # The first start has to docker pull a ~280MB image over the e2-micro's
      # throttled network — well past systemd's default 90s start timeout.
      # Subsequent starts reuse the cached image and finish in seconds.
      TimeoutStartSec=600

      # Tell docker to read its config (and credHelpers) from a writable
      # location — /root/.docker is read-only on COS.
      Environment=DOCKER_CONFIG=/var/lib/cloud/noepinax/docker

      # Refresh secrets + config from Secret Manager / metadata before each
      # (re)start, so rotating a secret = `systemctl restart noepinax-agents`.
      # Invoked via /bin/bash to bypass noexec mounts — most writable paths
      # on Container-Optimized OS are mounted noexec, so we interpret the
      # script rather than execve()'ing it.
      ExecStartPre=/bin/bash /var/lib/cloud/noepinax/fetch-config.sh

      # Pull the latest image tag — same `:latest` rebuild gets picked up on
      # restart with no instance recreate. (Use a versioned tag if you'd
      # rather pin and roll out explicitly.)
      ExecStartPre=/usr/bin/docker pull ${IMAGE}
      ExecStartPre=-/usr/bin/docker rm -f noepinax-agents

      ExecStart=/usr/bin/docker run --rm --name noepinax-agents \
        --env-file /etc/noepinax/agents.env \
        --log-driver=gcplogs \
        ${IMAGE}

      ExecStop=/usr/bin/docker stop noepinax-agents

      [Install]
      WantedBy=multi-user.target

  # ------------------------------------------------------------------
  # Tiny shim that resolves ${IMAGE} in the unit at boot — the systemd
  # unit can't read instance metadata directly, so we render it once.
  # ------------------------------------------------------------------
  - path: /var/lib/cloud/noepinax/render-unit.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/bin/bash
      set -euo pipefail
      MD=http://metadata.google.internal/computeMetadata/v1
      MD_HDR="Metadata-Flavor: Google"
      IMAGE=$(curl -sf -H "$MD_HDR" "$MD/instance/attributes/agent-image")
      if [[ -z "$IMAGE" ]]; then
        echo "[render-unit] instance metadata 'agent-image' is required" >&2
        exit 1
      fi
      sed -i "s|\${IMAGE}|$IMAGE|g" /etc/systemd/system/noepinax-agents.service

runcmd:
  # No docker-credential-gcr configure-docker call needed: Container-Optimized
  # OS pre-registers the Artifact Registry credential helper for *-docker.pkg.dev
  # automatically, and /root is read-only on COS so the configure-docker call
  # would fail anyway.
  #
  # Scripts are invoked via /bin/bash because most writable paths on COS
  # are mounted noexec — we read+interpret the file rather than execve() it.
  - /bin/bash /var/lib/cloud/noepinax/render-unit.sh
  - systemctl daemon-reload
  - systemctl enable noepinax-agents.service
  - systemctl start noepinax-agents.service
